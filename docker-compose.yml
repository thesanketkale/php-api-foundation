services:
  api:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: php-api-foundation
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      APP_ENV: development
      APP_DEBUG: "true"
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: php_api_foundation
      DB_USERNAME: app_user
      DB_PASSWORD: app_secret_password
      JWT_SECRET: dev_jwt_secret_key_at_least_32_characters_long_for_security!
      CORS_ALLOWED_ORIGINS: "http://localhost:3000,http://localhost:8080"
    volumes:
      - .:/var/www/html
      - /var/www/html/vendor
    depends_on:
      db:
        condition: service_healthy
    networks:
      - app-net

  db:
    image: mysql:8.0
    container_name: php-api-foundation-db
    restart: unless-stopped
    command:
      - --default-authentication-plugin=mysql_native_password
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
    environment:
      MYSQL_ROOT_PASSWORD: root_secret_password
      MYSQL_DATABASE: php_api_foundation
      MYSQL_USER: app_user
      MYSQL_PASSWORD: app_secret_password
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "app_user", "-papp_secret_password"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - app-net

volumes:
  mysql_data:
    driver: local

networks:
  app-net:
    driver: bridge
