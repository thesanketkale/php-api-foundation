name: Release Please

on:
  push:
    branches:
      - main

permissions: {}

jobs:
  release-please:
    name: Release Please
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Run Release Please Action
        uses: googleapis/release-please-action@7987452d335bdab51722bcc572c5471b079de288 # v4.1.3
        id: release
        with:
          release-type: php
          package-name: php-api-foundation
