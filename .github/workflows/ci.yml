name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-analyze:
    name: Lint & Static Analysis
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup PHP
        uses: shivammathur/setup-php@9e72090525849c5e82e596468b86eb55e9cc5401 # v2.32.0
        with:
          php-version: '8.3'
          extensions: pdo, pdo_sqlite, mbstring
          coverage: none

      - name: Validate composer.json
        run: composer validate --strict --no-check-all

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache dependencies
        uses: actions/cache@d4323d4df104b026a6aa633fdb11d772146be0bf # v4.2.2
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress

      - name: Code style check (PSR-12)
        run: vendor/bin/php-cs-fixer fix --dry-run --diff --using-cache=no

      - name: Static analysis (PHPStan Level Max)
        run: vendor/bin/phpstan analyse --no-progress --memory-limit=1G

      - name: Security audit (Composer)
        run: composer audit

      - name: Generate Code Quality Summary
        run: |
          cat << 'EOF' >> "$GITHUB_STEP_SUMMARY"
          ## 🔍 Code Quality & Static Analysis

          | Check | Tool / Standard | Result |
          |---|---|---|
          | Manifest Validity | Composer Validate (`--strict`) | :white_check_mark: Passed |
          | Code Style | PHP-CS-Fixer (PSR-12) | :white_check_mark: Passed |
          | Static Analysis | PHPStan (Level Max) | :white_check_mark: Passed |
          | Dependency Audit | Composer Audit | :white_check_mark: Passed |

          > All static analysis checks and coding standards verified successfully on PHP 8.3 (`ubuntu-24.04`).
          EOF

  openapi-lint:
    name: OpenAPI Contract Lint
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node.js
        uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4.2.0
        with:
          node-version: '22'

      - name: Lint OpenAPI 3.1 specification with Spectral
        run: npx @stoplight/spectral-cli lint openapi/openapi.yaml --ruleset .spectral.yaml

      - name: Generate OpenAPI Contract Summary
        run: |
          cat << 'EOF' >> "$GITHUB_STEP_SUMMARY"
          ## 📋 OpenAPI Contract & Schema Quality

          | Specification | Standard | Ruleset | Result |
          |---|---|---|---|
          | `openapi/openapi.yaml` | OpenAPI 3.1.0 | `.spectral.yaml` (`spectral:oas`) | :white_check_mark: 0 Errors / 0 Warnings |

          - **Tagged Operation Groups**: `Health`, `Authentication`, `Users`, `Notes`
          - **Strict RFC 9457 & Data Envelopes**: Verified compliant
          EOF

  test:
    name: Test PHP ${{ matrix.php-version }} (${{ matrix.db }})
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        php-version: ['8.2', '8.3', '8.4']
        db: ['sqlite', 'mysql']
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: rootpassword
          MYSQL_DATABASE: rest_api_test
          MYSQL_USER: api_test_user
          MYSQL_PASSWORD: api_test_password
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping --silent" --health-interval=10s --health-timeout=5s --health-retries=5
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup PHP
        uses: shivammathur/setup-php@9e72090525849c5e82e596468b86eb55e9cc5401 # v2.32.0
        with:
          php-version: ${{ matrix.php-version }}
          extensions: pdo, pdo_sqlite, pdo_mysql, mbstring
          coverage: none

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache dependencies
        uses: actions/cache@d4323d4df104b026a6aa633fdb11d772146be0bf # v4.2.2
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ matrix.php-version }}-${{ hashFiles('**/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-${{ matrix.php-version }}-

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress

      - name: Run test suite (SQLite)
        if: matrix.db == 'sqlite'
        env:
          APP_ENV: testing
          DB_CONNECTION: sqlite
          DB_DATABASE: ':memory:'
          JWT_SECRET: testing-secret-key-that-is-at-least-32-chars-long!
        run: vendor/bin/phpunit --no-coverage

      - name: Run migrations on MySQL
        if: matrix.db == 'mysql'
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: '3306'
          DB_DATABASE: rest_api_test
          DB_USERNAME: api_test_user
          DB_PASSWORD: api_test_password
        run: vendor/bin/phinx migrate -e default

      - name: Run test suite (MySQL)
        if: matrix.db == 'mysql'
        env:
          APP_ENV: testing
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: '3306'
          DB_DATABASE: rest_api_test
          DB_USERNAME: api_test_user
          DB_PASSWORD: api_test_password
          JWT_SECRET: testing-secret-key-that-is-at-least-32-chars-long!
        run: vendor/bin/phpunit --no-coverage

      - name: Generate Test Suite Summary
        env:
          PHP_VERSION: ${{ matrix.php-version }}
          DB_DRIVER: ${{ matrix.db }}
        run: |
          cat << EOF >> "$GITHUB_STEP_SUMMARY"
          ### 🧪 Test Suite: PHP ${PHP_VERSION} (${DB_DRIVER})

          | Component | Configuration | Status |
          |---|---|---|
          | PHP Runtime | ${PHP_VERSION} | :white_check_mark: Active |
          | Database Driver | ${DB_DRIVER} | :white_check_mark: Connected |
          | Test Runner | PHPUnit | :white_check_mark: Passed |
          EOF

  docker-build:
    name: Docker Image Build Test
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@c47758b77c9736f4b2ef4073d4d51994fabfe349 # v3.7.1

      - name: Build Docker image
        uses: docker/build-push-action@4a13e500e55cf31b7a5d59a38ab2040ab0f42f56 # v5.1.0
        with:
          context: .
          file: ./docker/Dockerfile
          push: false
          tags: php-api-foundation:test

      - name: Generate Docker Build Summary
        run: |
          cat << 'EOF' >> "$GITHUB_STEP_SUMMARY"
          ## 🐳 Docker Image Build

          | Target | Dockerfile | Tag | Status |
          |---|---|---|---|
          | Multi-stage Production Container | `./docker/Dockerfile` | `php-api-foundation:test` | :white_check_mark: Built Successfully |

          - **Engine**: Buildx (OCI container standard)
          - **Optimization**: Multi-stage production build verified
          EOF

  security-scan:
    name: Secret & Vulnerability Scan
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Run Gitleaks secret scanner
        uses: gitleaks/gitleaks-action@f586c14365d4643c6aa59d472ae6e984bf47bb34 # v2.3.8
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_CACHE: "false"

      - name: Generate Security Scan Summary
        run: |
          cat << 'EOF' >> "$GITHUB_STEP_SUMMARY"
          ## 🛡️ Security & Secret Detection

          | Scanner | Scope | Cache Status | Result |
          |---|---|---|---|
          | Gitleaks | Full Git History (`fetch-depth: 0`) | Disabled (`GITLEAKS_ENABLE_CACHE: "false"`) | :white_check_mark: Clean (0 Secrets Detected) |

          - **Branch / History**: Validated against complete commit tree
          - **Audit**: Zero secrets or credentials detected
          EOF
