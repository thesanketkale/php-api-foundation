name: Deploy to Azure (App Service via OIDC)

on:
  workflow_dispatch:
    inputs:
      target_env:
        description: 'Target Environment'
        required: true
        default: 'production'
        type: choice
        options:
          - production
          - staging

permissions: {}

concurrency:
  group: deploy-azure-${{ inputs.target_env || 'production' }}
  cancel-in-progress: false

jobs:
  deploy-azure:
    name: Build, Push & Deploy to Azure App Service
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: ${{ inputs.target_env || 'production' }}
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Log in to Azure via OpenID Connect (OIDC)
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Log in to Azure Container Registry (ACR)
        run: |
          az acr login --name "${{ secrets.AZURE_ACR_NAME }}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build and push container image to ACR
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        env:
          ACR_SERVER: ${{ secrets.AZURE_ACR_NAME }}.azurecr.io
          IMAGE_NAME: php-api-foundation
          IMAGE_TAG: ${{ github.sha }}
        with:
          context: .
          file: ./docker/Dockerfile
          push: true
          tags: ${{ env.ACR_SERVER }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }},${{ env.ACR_SERVER }}/${{ env.IMAGE_NAME }}:latest

      - name: Deploy Container to Azure App Service
        uses: azure/webapps-deploy@02a81bead70021f5284939794bcec79c271ab383 # v3.0.8
        with:
          app-name: ${{ secrets.AZURE_APP_NAME || 'php-api-foundation-app' }}
          images: '${{ secrets.AZURE_ACR_NAME }}.azurecr.io/php-api-foundation:${{ github.sha }}'

      - name: Smoke Test Readiness Endpoint
        if: env.APP_BASE_URL != ''
        env:
          APP_BASE_URL: ${{ secrets.APP_BASE_URL }}
        run: |
          echo "Testing ${APP_BASE_URL}/v1/health/ready..."
          curl -f -s "${APP_BASE_URL}/v1/health/ready" || exit 1
          echo "Azure App Service Deployment verified healthy!"
