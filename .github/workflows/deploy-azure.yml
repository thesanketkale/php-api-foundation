name: Deploy to Azure (App Service via OIDC)

on:
  workflow_dispatch:
    inputs:
      target_env:
        description: 'Target Environment'
        required: true
        default: 'production'
        type: choice
        options:
          - production
          - staging

permissions: {}

concurrency:
  group: deploy-azure-${{ inputs.target_env || 'production' }}
  cancel-in-progress: false

jobs:
  deploy-azure:
    name: Build, Push & Deploy to Azure App Service
    runs-on: ubuntu-latest
    environment: ${{ inputs.target_env || 'production' }}
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Log in to Azure via OpenID Connect (OIDC)
        uses: azure/login@a65d910e8af852a8061c627c456678983e180302 # v2.2.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Log in to Azure Container Registry (ACR)
        run: |
          az acr login --name "${{ secrets.AZURE_ACR_NAME }}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@c47758b77c9736f4b2ef4073d4d51994fabfe349 # v3.7.1

      - name: Build and push container image to ACR
        uses: docker/build-push-action@4a13e500e55cf31b7a5d59a38ab2040ab0f42f56 # v5.1.0
        env:
          ACR_SERVER: ${{ secrets.AZURE_ACR_NAME }}.azurecr.io
          IMAGE_NAME: php-api-foundation
          IMAGE_TAG: ${{ github.sha }}
        with:
          context: .
          file: ./docker/Dockerfile
          push: true
          tags: ${{ env.ACR_SERVER }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }},${{ env.ACR_SERVER }}/${{ env.IMAGE_NAME }}:latest

      - name: Deploy Container to Azure App Service
        uses: azure/webapps-deploy@de617f46172a906d0617bb0e50d81e9e3aec24c8 # v3.0.1
        with:
          app-name: ${{ secrets.AZURE_APP_NAME || 'php-api-foundation-app' }}
          images: '${{ secrets.AZURE_ACR_NAME }}.azurecr.io/php-api-foundation:${{ github.sha }}'

      - name: Smoke Test Readiness Endpoint
        if: env.APP_BASE_URL != ''
        env:
          APP_BASE_URL: ${{ secrets.APP_BASE_URL }}
        run: |
          echo "Testing ${APP_BASE_URL}/v1/health/ready..."
          curl -f -s "${APP_BASE_URL}/v1/health/ready" || exit 1
          echo "Azure App Service Deployment verified healthy!"
