name: Deploy to AWS (ECS Fargate via OIDC)

on:
  workflow_dispatch:
    inputs:
      target_env:
        description: 'Target Environment'
        required: true
        default: 'production'
        type: choice
        options:
          - production
          - staging
      aws_region:
        description: 'AWS Region'
        required: true
        default: 'us-east-1'

permissions: {}

concurrency:
  group: deploy-aws-${{ inputs.target_env || 'production' }}
  cancel-in-progress: false

jobs:
  deploy-aws:
    name: Build, Push & Deploy to ECS Fargate
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: ${{ inputs.target_env || 'production' }}
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Configure AWS credentials via OpenID Connect (OIDC)
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          role-session-name: github-actions-ecs-deploy
          aws-region: ${{ inputs.aws_region }}

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2.1.7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build and push Docker image to Amazon ECR
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: ${{ secrets.AWS_ECR_REPOSITORY || 'php-api-foundation' }}
          IMAGE_TAG: ${{ github.sha }}
        with:
          context: .
          file: ./docker/Dockerfile
          push: true
          tags: ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:${{ env.IMAGE_TAG }},${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:latest

      - name: Trigger ECS Task Definition Update & Service Deployment
        env:
          ECS_CLUSTER: ${{ secrets.AWS_ECS_CLUSTER || 'php-api-cluster' }}
          ECS_SERVICE: ${{ secrets.AWS_ECS_SERVICE || 'php-api-service' }}
        run: |
          echo "Updating ECS service ${ECS_SERVICE} in cluster ${ECS_CLUSTER}..."
          aws ecs update-service \
            --cluster "${ECS_CLUSTER}" \
            --service "${ECS_SERVICE}" \
            --force-new-deployment

      - name: Wait for ECS Service Stability
        env:
          ECS_CLUSTER: ${{ secrets.AWS_ECS_CLUSTER || 'php-api-cluster' }}
          ECS_SERVICE: ${{ secrets.AWS_ECS_SERVICE || 'php-api-service' }}
        run: |
          echo "Waiting for ECS service stability..."
          aws ecs wait services-stable \
            --cluster "${ECS_CLUSTER}" \
            --service "${ECS_SERVICE}"

      - name: Smoke Test Readiness Endpoint
        if: env.APP_BASE_URL != ''
        env:
          APP_BASE_URL: ${{ secrets.APP_BASE_URL }}
        run: |
          echo "Testing ${APP_BASE_URL}/v1/health/ready..."
          curl -f -s "${APP_BASE_URL}/v1/health/ready" || exit 1
          echo "AWS ECS Deployment verified healthy!"
