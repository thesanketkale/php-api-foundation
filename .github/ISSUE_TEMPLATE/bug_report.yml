name: Bug Report
description: Create a report to help us reproduce and fix an issue.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting an issue! Please check existing issues first to avoid duplicates.
  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear and concise description of what the bug is.
      placeholder: Describe the unexpected behavior...
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: Detailed steps to reproduce the issue.
      placeholder: |
        1. Send request '...'
        2. With payload '...'
        3. See error '...'
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen instead?
      placeholder: Describe expected behavior...
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior & Logs
      description: Include any RFC 9457 error response payloads, error logs, or terminal output.
      render: shell
    validations:
      required: false
  - type: dropdown
    id: environment
    attributes:
      label: Execution Environment
      description: Where is the API running?
      options:
        - "Local (PHP CLI built-in server)"
        - "Docker Compose"
        - "Shared Hosting (Apache / cPanel / FTPS)"
        - "AWS ECS Fargate"
        - "Azure App Service"
        - "Other"
    validations:
      required: true
  - type: input
    id: php_version
    attributes:
      label: PHP Version
      description: Output of `php -v`.
      placeholder: "e.g. 8.3.11"
    validations:
      required: true
  - type: checkboxes
    id: checklist
    attributes:
      label: Security & Pre-Check
      options:
        - label: This issue does NOT describe a sensitive security vulnerability (use SECURITY.md for vulnerabilities).
          required: true
        - label: I have verified this behavior on the latest release or main branch.
          required: true
